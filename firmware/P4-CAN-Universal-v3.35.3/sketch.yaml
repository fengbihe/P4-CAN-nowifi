# Arduino CLI sketch project file（工程化配置文件）
# ---------------------------------------------------------------------------
# 作用：让 arduino-cli / VS Code 扩展记住这块板的板级参数，
#       不用每次敲一长串 FQBN。
#
# 用法：
#   1) 命令行：  arduino-cli compile firmware/P4-CAN-Universal-v3.35.2
#                （不给 --fqbn 时自动用下面的 default_fqbn）
#   2) VS Code： 已安装扩展 vscode-arduino-cli-wrapper，
#                打开文件夹后状态栏会出现 Compile / Upload / Monitor 按钮，
#                资源管理器里会多出「Arduino CLI」视图。
#
# 注意：本文件只写 default_fqbn，不使用 profiles。
#       原因：一旦定义了 profiles，arduino-cli 会要求用 --profile 编译，
#       会和 scripts/build.sh 里显式传 --fqbn 的方式冲突。
#       板级参数与 scripts/build.sh 里的 BOARD_OPTIONS_BASE 必须保持一致；
#       改这里就要同步改 build.sh。
# ---------------------------------------------------------------------------

# 浏览器/扩展里显示的板子名（仅注释性，arduino-cli 不读这一项）
# name: P4-CAN Universal v3.35.2

# 默认板级参数 = 原作者 Compile-P4-Variants.ps1 里的那套（postv3 变体）
#   芯片 v3.00 之前（prev3）请把 ChipVariant 改成 prev3
default_fqbn: esp32:esp32:esp32p4:ChipVariant=postv3,FlashSize=32M,PartitionScheme=app3M_fat9M_16MB,PSRAM=enabled,USBMode=hwcdc,CDCOnBoot=cdc,FlashMode=qio
